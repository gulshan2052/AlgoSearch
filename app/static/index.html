<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Similar Problem Search</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #656d76;
    --border: #d0d7de;
    --accent: #0969da;
    --accent-hover: #0550ae;
    --error: #cf222e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  label { display: block; font-weight: 600; margin: 0 0 6px; font-size: 0.9rem; }
  textarea {
    width: 100%;
    min-height: 180px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,0.15); }
  .row { display: flex; align-items: flex-end; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  .field-k { display: flex; flex-direction: column; }
  .field-k input {
    width: 90px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
  }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 6px; text-align: right; }
  button {
    flex: 1;
    min-width: 120px;
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: var(--muted); cursor: not-allowed; }
  .results { margin-top: 24px; }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .result-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .result-title a { font-size: 1.05rem; font-weight: 600; color: var(--accent); text-decoration: none; }
  .result-title a:hover { text-decoration: underline; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .platform {
    font-size: 0.75rem;
    background: #eef1f4;
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: capitalize;
  }
  .score {
    font-size: 0.8rem;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .summary { margin: 12px 0 0; font-size: 0.9rem; color: #374151; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .error { color: var(--error); font-weight: 600; }
  .status { margin-top: 12px; font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <h1>Similar Problem Search</h1>
  <p class="sub">Paste a problem statement and find the most similar indexed problems.</p>

  <div class="card">
    <form id="search-form">
      <label for="statement">Problem Statement</label>
      <textarea id="statement" name="statement" placeholder="Paste the entire problem statement here, including any constraints (e.g. N <= 10^5), time limits, etc." required></textarea>

      <div class="row">
        <div class="field-k">
          <label for="top-k">Top K results</label>
          <input id="top-k" name="top_k" type="number" min="1" max="50" value="10">
        </div>
        <button id="search-btn" type="submit">Search</button>
      </div>
      <p class="hint">Tip: paste the full text with constraints in the single box above.</p>
    </form>
  </div>

  <div id="status" class="status" hidden></div>
  <div id="results" class="results"></div>
</div>

<script>
  const form = document.getElementById('search-form');
  const statement = document.getElementById('statement');
  const topK = document.getElementById('top-k');
  const btn = document.getElementById('search-btn');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');

  function setLoading(loading) {
    btn.disabled = loading;
    btn.textContent = loading ? 'Searching…' : 'Search';
  }

  function formatScore(score) {
    if (score == null) return '—';
    return (score * 100).toFixed(1) + '%';
  }

  function renderResults(items) {
    resultsEl.innerHTML = '';
    if (!items || items.length === 0) {
      resultsEl.innerHTML = '<p class="empty">No matching problems found.</p>';
      return;
    }
    const list = document.createElement('div');
    items.forEach((item) => {
      const div = document.createElement('div');
      div.className = 'result';

      const top = document.createElement('div');
      top.className = 'result-top';

      const titleWrap = document.createElement('div');
      titleWrap.className = 'result-title';
      const a = document.createElement('a');
      a.href = item.url || '#';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = item.title || '(untitled)';
      titleWrap.appendChild(a);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const platform = document.createElement('span');
      platform.className = 'platform';
      platform.textContent = item.platform || 'unknown';
      const score = document.createElement('span');
      score.className = 'score';
      score.textContent = 'similarity ' + formatScore(item.similarity_score);
      meta.appendChild(platform);
      meta.appendChild(score);

      top.appendChild(titleWrap);
      top.appendChild(meta);

      const summary = document.createElement('p');
      summary.className = 'summary';
      summary.textContent = item.summary || '';

      div.appendChild(top);
      div.appendChild(summary);
      list.appendChild(div);
    });
    resultsEl.appendChild(list);
  }

  async function onSubmit(e) {
    e.preventDefault();

    const text = statement.value.trim();
    if (!text) return;

    const k = parseInt(topK.value, 10);
    const payload = {
      statement: text,
      constraints: '',
      top_k: Number.isFinite(k) && k > 0 ? k : 10
    };

    statusEl.hidden = true;
    statusEl.textContent = '';
    statusEl.classList.remove('error');
    setLoading(true);

    try {
      const res = await fetch('/api/v1/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        let detail = res.statusText;
        try {
          const err = await res.json();
          if (err.detail) detail = typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail);
        } catch (_) {}
        throw new Error(detail || ('Request failed (' + res.status + ')'));
      }
      const data = await res.json();
      renderResults(data);
    } catch (err) {
      resultsEl.innerHTML = '';
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.classList.add('error');
      statusEl.hidden = false;
    } finally {
      setLoading(false);
    }
  }

  form.addEventListener('submit', onSubmit);
</script>
</body>
</html>
